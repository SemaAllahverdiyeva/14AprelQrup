spring.application.name=user-service

server.port=8082

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/user_db
spring.datasource.username=root
spring.datasource.password=BURAYA_MYSQL_PAROLUNU_YAZ
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Resilience4j Retry
resilience4j.retry.instances.computerService.max-attempts=3
resilience4j.retry.instances.computerService.wait-duration=1s

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.computerService.sliding-window-size=5
resilience4j.circuitbreaker.instances.computerService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.computerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.computerService.wait-duration-in-open-state=10s

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.endpoint.health.show-details=always
