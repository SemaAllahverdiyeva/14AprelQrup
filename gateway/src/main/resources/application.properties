spring.application.name=gateway

server.port=8766

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=computer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://computer-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/computers/**